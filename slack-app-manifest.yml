# Create the Slack app from this manifest:
# https://api.slack.com/apps -> Create New App -> From an app manifest
# Then: Install to Workspace -> copy the *User* OAuth token (xoxp-...)
display_information:
  name: Notification Radar
  description: Read-only poller feeding my personal unified notification dashboard
  background_color: "#3C3489"
oauth_config:
  scopes:
    user:
      - im:history
      - im:read
      - mpim:history
      - mpim:read
      - users:read
      - users:read.email
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
